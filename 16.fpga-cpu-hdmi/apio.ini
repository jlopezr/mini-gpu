[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# El dominio de CPU corre a 100 MHz desde el hito C. A 120 no cumplia ninguna
# semilla, ni siquiera despues de sacar la decodificacion de opcode del cono de
# datos del PC. Tras anadir MUL, MULFX y DIV cumplen siete de ocho, entre 95,37
# y 112,88 MHz. Se fija la mejor por margen: aqui la semilla casi nunca decide
# si el diseno funciona. El razonamiento completo esta en README.md.
#
# Conviene rebarrer semillas tras un cambio de RTL grande:
#   ..\tools\build-sweep.ps1 --prototype 16.fpga-cpu-hdmi --seeds 1 2 3 4 5 6 7 8

# BACKPORT DE R0 CABLEADO A CERO: barrido rehecho.
#
# El cambio es una linea en register_file.v --descartar la escritura a R0-- y
# aun asi invalida el barrido anterior, como cualquier otro cambio de RTL: la
# semilla es propiedad de un netlist, no de un diseno. Con la semilla vieja
# este core daba 109,36 MHz (+9,4%); rebarrido, cumplen las ocho, entre 102,27 y 112,96 MHz; se fija la 4, +13,0%.

# WRITE_WORD (comando 0x13 del monitor): la semilla 4 --la que estaba fijada--
# se cayo a 96,58 MHz, un 3,4 % corta. Rebarrido: cumplen SIETE de ocho, entre
# 96,58 y 105,03 MHz, y justamente la que fallaba era la fijada. Se fija la 1,
# la de mas margen, +5,0 %.
#
# El margen es bastante peor que el +13,0 % de antes, y eso NO es la semilla:
# el diseno perdio unos 15 MHz de holgura. Lo nuevo en el camino son los dos
# estados de la escritura de palabra en sdram_system_adapter.v y el mux de
# req_wdata / req_wmask que los alimenta. Si hace falta recuperar holgura aqui,
# ese mux es el primer sitio donde mirar: se puede registrar a costa de un
# ciclo por acceso del monitor, que sobre los 16 ms de una ida y vuelta por
# UART no se mide.
#
# MIGRACION A MMIO v2 (20/09/2026), Y ES LA UNICA CARPETA A LA QUE LE CUESTA
# FRECUENCIA. Las otras cinco de la familia CPU no perdieron nada.
#
# Recien migrada: CERO de dieciseis semillas, 90,32 a 99,63 MHz. No era la
# semilla, era la distribucion entera por debajo de la restriccion; ampliar el
# barrido de 8 a 16 solo sirvio para descartarlo.
#
# Y EL PARRAFO DE ARRIBA APUNTABA AL SITIO EQUIVOCADO. Decia que si hacia falta
# holgura habia que mirar el mux de req_wdata/req_wmask. Extraido el camino
# critico del build.log post-migracion, ese mux no aparece:
#
#   adapter_i.mmio_address_TRELLIS_FF_Q_28.Q   <- bit 28 de la direccion
#     -> mmio_decoder.v:69                     <- eleccion de bloque
#     -> registers_i.video_mode -> adapter_i.saved_cpu_read -> mmio_select
#
# Empieza en un bit que solo existe porque v2 ensancha la direccion de 12 a 32,
# y vuelve a entrar en la logica de proximo estado del propio adaptador: un
# lazo combinacional de un ciclo. La 18, la 19 y la 21 no lo sufren porque
# `mmio_mux` lo parte; esta carpeta no tiene mux, su arbitraje vive dentro de
# sdram_system_adapter.v. El coste de v2 aqui es ESTRUCTURAL, no de area.
#
# Arreglado registrando la respuesta MMIO dentro del adaptador --el estado
# nuevo STATE_MMIO_DONE-- a costa de UN CICLO por acceso. Con eso:
#
#   sin registro   0 de 16    90,32 a  99,63
#   con registro   7 de 16    94,56 a 103,19    mediana 99,5
#
# Se fija la 14, la de mas margen: 103,19 MHz, +3,2 %. Es menos holgura que el
# +5,0 % de v1, y ese es el precio honesto de v2 en esta carpeta.
#
# Si algun dia hace falta mas, el siguiente paso NO es otra semilla: es
# registrar tambien los `select` del decodificador, o sea darle a la 16 el mux
# que tienen las otras tres. Eso ya no es migrar un mapa. El camino critico de
# hoy es su gemelo de escritura:
#   mmio_address[28] -> logica de mmio_write -> registers_i.fb_front....CE
#
# Para repetirlo:
#   ..\tools\build-sweep.ps1 --prototype 16.fpga-cpu-hdmi --seeds 1 2 3 4 5 6 7 8
#   ..\tools\build-sweep.ps1 --prototype 16.fpga-cpu-hdmi --seeds 9 10 11 12 13 14 15 16
nextpnr-extra-options = --seed 14
