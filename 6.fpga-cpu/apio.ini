[env:default]
board = ulx3s-85f
top-module = top
default-testbench = monitor_tb.v

# El diseno va a 120 MHz y el margen es estrecho: de ocho semillas cierran
# cuatro, entre 109,90 y 124,39 MHz. Aqui la semilla SI decide si el diseno
# cumple, al contrario que en 15.fpga-cpu-hdmi, donde solo elige margen.
# Se fija la mejor.
#
# Conviene rebarrer semillas tras un cambio de RTL:
#   .\tools\seed-sweep.ps1 -ProjectDir 6.fpga-cpu -Seeds (1..8)
nextpnr-extra-options = --seed 3
