[env:default]
board = ulx3s-85f
top-module = top
default-testbench = monitor_tb.v

# El diseno va a 120 MHz y el margen es estrecho: de ocho semillas cierran
# cuatro, entre 109,90 y 124,39 MHz. Aqui la semilla SI decide si el diseno
# cumple, al contrario que en 16.fpga-cpu-hdmi, donde solo elige margen.
# Se fija la mejor.
#
# Conviene rebarrer semillas tras un cambio de RTL:
#   .\tools\build-sweep.ps1 --prototype 6.fpga-cpu --seeds 1 2 3 4 5 6 7 8

# BACKPORT DE R0 CABLEADO A CERO: barrido rehecho.
#
# El cambio es una linea en register_file.v --descartar la escritura a R0-- y
# aun asi invalida el barrido anterior, como cualquier otro cambio de RTL: la
# semilla es propiedad de un netlist, no de un diseno. Con la semilla vieja
# este core daba 124,10 MHz (+3,4%); rebarrido, cumplen siete de ocho, entre 119,13 y 127,26 MHz; se fija la 7, +6,0%.
#
# WRITE_WORD Y RELOJ A 100 MHz. A 120 no cumplia ninguna de ocho semillas
# (109,90 a 124,39 antes del comando; 85,92 a 99,40 despues), asi que se baja
# la restriccion --ver pll_100.v-- y con ella el baudio, de 3 a 1 Mbaud.
#
# A 100 cumple UNA de ocho: la 4, con 104,41 MHz (+4,4 %). El resto va de 92,51
# a 99,29, mediana 97,05.
#
# OJO, esto es lo mas justo del repositorio y hay que tratarlo como tal: aqui
# la semilla NO elige margen, elige si el diseno cumple, y cualquier cambio de
# RTL --por pequeno que parezca-- vuelve a tirar el dado. Rebarrer SIEMPRE:
#   ..\tools\build-sweep.ps1 --prototype 6.fpga-cpu --seeds 1 2 3 4 5 6 7 8
#
# Si algun dia esto deja de cumplir, el camino critico no esta en monitor.v
# --de ahi ya se saco la BRAM del mux de `response_byte_0`-- sino en
# `mem_address -> sysid_ready -> memory_map_i.release_wait`, que a 120 MHz
# salia con 1,2 ns de logica y mas de 4 de rutado: la 6 ocupa el 7 % del chip
# y el emplazador la dispersa.
#
# MIGRACION A MMIO v2 (20/09/2026), Y EL RESULTADO ES EL CONTRARIO DEL TEMIDO.
#
# El cambio toca `sysid_selected`, que esta EN ese camino critico de arriba:
# la comparacion pasa de `mem_address[31:4] == 28'h800_00f0` a
# `mem_address[31:5] == 27'h400_0000 && mem_address[4:2] != 3'd7`, o sea una
# comparacion mas. Con una carpeta que cumplia UNA de ocho, la expectativa
# razonable era perder.
#
# Medido, cumplen LAS OCHO, entre 111,04 y 117,55, mediana 115,54. Se mantiene
# la 4, que sigue siendo la de mas margen: +17,6 %.
#
#   antes    1 de 8    92,51 a 104,41   mediana  97,05   mejor 104,41 (s4)
#   ahora    8 de 8   111,04 a 117,55   mediana 115,54   mejor 117,55 (s4)
#
# Las OCHO semillas de ahora baten al MEJOR de antes. Eso no es colocacion, y
# por eso no se dio por bueno: ver 6.fpga-cpu/docs/migracion-v2.md, donde se
# mide la 6 pre-migracion construida y barrida el MISMO dia con las MISMAS
# ocho semillas. Comparar un barrido de hoy contra un numero escrito en este
# fichero hace meses puede estar comparando dos versiones de la herramienta,
# que es la trampa de "un maximo contra una muestra" con otro disfraz.
#
# Para repetirlo:
#   ..\tools\build-sweep.ps1 --prototype 6.fpga-cpu --seeds 1 2 3 4 5 6 7 8
nextpnr-extra-options = --seed 4