[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# El dominio de CPU corre a 100 MHz desde el hito C. A 120 no cumplia ninguna
# semilla (maximo 111,35 MHz); a 100 cumplen las ocho, entre 103,89 y 115,55.
# Se fija la mejor por margen, no por necesidad: aqui la semilla ya no decide
# si el diseno funciona. El razonamiento completo esta en README.md.
#
# Conviene rebarrer semillas tras un cambio de RTL grande:
#   (Get-Content _build/default/hardware.pnr -Raw | ConvertFrom-Json).fmax
nextpnr-extra-options = --seed 3
