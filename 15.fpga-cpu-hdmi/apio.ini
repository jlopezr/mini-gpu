[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# El dominio de 120 MHz ya no cumple con ninguna semilla desde el hito B.
# Barrido de ocho: 106,73 / 107,85 / 107,98 / 109,72 / 112,71 / 113,08 /
# 113,78 / 119,85 MHz. Se fija la mejor, que se queda a 0,15 MHz del objetivo.
# El camino critico es interno a la CPU (instruction -> decode -> branch_taken
# -> pc, 8,34 ns con 4,9 de routing) y no toca el subsistema de video: no hay
# camino nuevo, hay menos libertad de colocacion. Detalle en README.md.
#
# Hay que volver a barrer semillas tras CUALQUIER cambio de RTL:
#   (Get-Content _build/default/hardware.pnr -Raw | ConvertFrom-Json).fmax
nextpnr-extra-options = --seed 6
