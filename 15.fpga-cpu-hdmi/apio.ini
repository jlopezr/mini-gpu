[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# Con el subsistema de video presente, el dominio de 120 MHz queda al limite y
# la semilla decide si cumple. Medido sobre cinco semillas: 114,55 / 118,37 /
# 118,68 / 120,66 / 123,32 MHz. Se fija la mejor. Hay que volver a barrer
# semillas tras CUALQUIER cambio de RTL:
#   (Get-Content _build/default/hardware.pnr -Raw | ConvertFrom-Json).fmax
nextpnr-extra-options = --seed 4

