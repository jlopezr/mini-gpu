[apio]
default-env = default

# NO se fija ninguna semilla, y es deliberado. Es el mismo criterio que la 12,
# la 14 y la 17 ya llevaban escrito, extendido aqui al cerrar la migracion a
# MMIO v2: en la familia GPU el margen se mide en decenas de por ciento, asi
# que la semilla no decide si el diseno funciona --tras v2 esta carpeta da
# 40,43 MHz de sdram_clk sobre los 25 del .lpf, o sea +61,7 %--. Fijar una
# solo serviria para que el numero de COMPARATIVA.md fuese reproducible, a
# cambio de tener que rebarrer con cada cambio de RTL. En las carpetas de CPU
# si se fija, porque alli el margen se mide en unidades.
#
# Y el numero que vale es el PEOR de un barrido, no el de una build suelta.
# Para rehacerlo:
#   ..\tools\build-sweep.ps1 --prototype 22.fpga-gpu-bl8 --seeds 1 2 3 4 5 6 7 8
# Ejecuta `..\tools\build.ps1 --prototype 22` ANTES: build-sweep no sintetiza,
# re-ruta el hardware.json archivado, y si el RTL ha cambiado desde entonces
# devuelve ocho numeros plausibles y falsos.

[common]
board = ulx3s-85f
nextpnr-extra-options = --detailed-timing-report
default-testbench = gpu_lsu2_tb.v
# Misma razon que en 17: el pase AUTONAME de Yosys 0.63 crece sin limite
# practico en este netlist. Se conserva el mapeo y todas las comprobaciones,
# se omite solo la expansion de nombres. El write_json va por env porque la
# ruta lleva el nombre del env dentro.

# ============================================================
# Envs de timing en aislado.
#
# Miden la LSU SOLA en un chip vacio, via lsu_timing_top.v /
# lsu1_timing_top.v. El numero NO es comparable con el Fmax del sistema
# completo (es optimista: sin competencia por rutado ni fanout del SM).
# Solo sirve comparando 'lsu2-timing' contra 'lsu1-timing', que usan el
# mismo envoltorio y el mismo chip vacio.
# ============================================================

[env:lsu2-timing]
top-module = lsu_timing_top
yosys-extra-options = -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/lsu2-timing/hardware.json

[env:lsu1-timing]
top-module = lsu1_timing_top
yosys-extra-options = -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/lsu1-timing/hardware.json

# ============================================================
# Sistemas completos.
#
# 'default' es la linea base heredada de 17: gpu_system.v + gpu_lsu (v1) sobre
# sdram_controller BL1. No se toca; es contra lo que se compara.
#
# 'bl8' es el sistema nuevo: gpu_system_bl8.v + gpu_lsu2 + gpu_aux_adapter_128
# sobre memory_fabric_4 + sdram_controller_128.
# ============================================================

# OJO: 'default' TIENE que ser el diseno real del prototipo, no la linea base.
# x.tests/backends/board.py mira `_build/default/hardware.bit` con la ruta
# escrita a mano, asi que run-board/test-board programan SIEMPRE ese fichero.
# Con 'default' apuntando a otra cosa, la placa acaba con un bitstream que no
# es el que crees que has subido -- que es exactamente como se manifesto esto
# la primera vez que se probo en placa.

[env:default]
top-module = top_bl8
yosys-extra-options = -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/default/hardware.json

# Linea base heredada de 17 (LSU v1 sobre BL1). Solo para comparar medidas;
# nunca es lo que se sube a la placa para probar este prototipo.
[env:base-bl1]
top-module = top
yosys-extra-options = -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/base-bl1/hardware.json
