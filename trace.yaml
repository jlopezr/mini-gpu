project: minigpu
version: 1

rules:
  - accepted-requirements-satisfied
  - accepted-specifications-implemented
  - accepted-targets-fully-verified

scan:
  - "**/*.md"
  - "**/*.sv"
  - "**/*.v"
  - "**/*.trace.yaml"
  - "**/*.py"
  - "**/*.asm"
  - "**/*.s"

exclude:
  - ".git/**"
  - ".venv/**"
  - "**/__pycache__/**"
  - "**/_build/**"
  - "**/node_modules/**"
