[env:default]
board = ulx3s-85f
top-module = top
default-testbench = memory_fabric_fifo_6_tb.v
# La GPU deja el 71 % de las LUT con la sintesis por defecto y `router1` no
# converge (7 de octubre de 2026, 3 horas sin acabar). `-nowidelut` quita
# PFUMX y L6MUX21: -11,4 % de LUT4 en yosys (46.870 -> 41.508). Va DELANTE de
# `-run`, porque apio mete estas opciones dentro de `synth_ecp5`.
# Semilla 17 y timingweight 120 (el valor medido en la 30) son de partida.
# SIN `--tmg-ripup` a proposito: con el, router1 repite el enrutado en rondas y
# no termino en 2,5 h (gpu-36) ni en 1,5 h (gpu-36-bram); sin el, termino en 20
# minutos y dio el informe real con sus caminos criticos. Primero saber donde
# esta el diseno; el ripup se prueba despues, cuando cierre por poco.
nextpnr-extra-options = --seed 17 --detailed-timing-report --placer-heap-timingweight 120
yosys-extra-options = -nowidelut -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/default/hardware.json
