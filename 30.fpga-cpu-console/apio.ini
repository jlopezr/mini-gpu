[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_burst_system_tb.v

# Semilla y opciones de nextpnr, medidas JUNTAS en un barrido de 8 (2026-10-04,
# con INPUT): tmg-ripup + placer-heap-timingweight 120 dejan cumplir 7 de 8
# semillas y la 6 da 85,76 MHz (+7,2 %) sobre los 80 exigidos (mediana 82,00).
# Antes de INPUT (2026-09-29) eran 6 de 8 y la 5 daba 87,80 MHz. Sin las opciones
# no cumplia ninguna (mediana 76,08). La semilla es propiedad de un netlist
# concreto: rebarrer tras cualquier cambio de RTL. El historial de barridos esta
# en git.
#   ..\tools\build-sweep.ps1 --prototype 30.fpga-cpu-console --seeds 1 2 3 4 5 6 7 8 --nextpnr-options tmg-ripup placer-heap-timingweight=120 --apply
nextpnr-extra-options = --seed 6 --detailed-timing-report --tmg-ripup --placer-heap-timingweight 120
