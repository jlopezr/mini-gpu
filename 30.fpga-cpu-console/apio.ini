[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_burst_system_tb.v

# Semilla y opciones de nextpnr, medidas JUNTAS en un barrido de 8 (2026-09-29):
# tmg-ripup + placer-heap-timingweight 120 dejan cumplir 6 de 8 semillas y la 5 da
# 87,80 MHz (+9,8 %) sobre los 80 exigidos. Sin las opciones no cumplia ninguna
# (mediana 76,08). La semilla es propiedad de un netlist concreto: rebarrer tras
# cualquier cambio de RTL. El historial de barridos esta en git.
#   ..\tools\build-sweep.ps1 --prototype 30.fpga-cpu-console --seeds 1 2 3 4 5 6 7 8 --nextpnr-options tmg-ripup placer-heap-timingweight=120 --apply
nextpnr-extra-options = --seed 5 --tmg-ripup --placer-heap-timingweight 120
