[env:default]
board = ulx3s-85f
top-module = top
# El banco por defecto tiene que montar el camino que se sintetiza. Era
# cpu_sdram_system_tb.v, que monta `sdram_system_adapter` --el bloque unico de
# la 16, que ya no esta en top.v-- y cuya ventana MMIO es de 16 bytes en vez de
# 32. `apio sim` sin argumentos ensenaba el diseno anterior.
default-testbench = cpu_burst_system_tb.v

# El dominio de CPU corre a 80 MHz desde que el camino de memoria pasa a 128
# bits: a 100 no cumple NINGUNA semilla (83,9 a 91,8 MHz, mediana 86,4). A 80
# cumplen las ocho; con la combinacion de escrituras dentro, entre 83,14 y
# 93,24 MHz, asi que la semilla vuelve a no
# decidir si el diseno funciona. Se fija la mejor por margen.
#
# Con los contadores de rendimiento dentro, la semilla 2 --que era la fijada--
# se cayo a 79,15 MHz, un 1,1% corta. Rebarrido: cumplian siete de ocho, entre
# 80,93 y 93,95 MHz. El diseno no estaba al limite; lo estaba la semilla.
#
# Desde que DQ se captura en el flanco de bajada, el barrido vuelve a salir
# holgado: ocho de ocho, entre 85,7 y 94,8 MHz. Se fija la 1, la de mas margen.
#
# CUIDADO con lo que este numero significa. Mide caminos DENTRO del chip. El
# fallo que tuvo esta carpeta en placa estaba en la captura de DQ, que entra
# por un pin, y con el diseno roto este barrido daba +14,5% de holgura igual.
# Una semilla que cumple no dice que la SDRAM se lea bien: eso lo dice la
# matriz de beats x DQ del README.
#
# Lo que sigue es la historia anterior, de cuando la restriccion era 100:
# A 120 no cumplia ninguna
# semilla, ni siquiera despues de sacar la decodificacion de opcode del cono de
# datos del PC. Tras anadir MUL, MULFX y DIV cumplen siete de ocho, entre 95,37
# y 112,88 MHz. Se fija la mejor por margen: aqui la semilla casi nunca decide
# si el diseno funciona. El razonamiento completo esta en README.md.
#
# Conviene rebarrer semillas tras un cambio de RTL grande:
#   ..\tools\build-sweep.ps1 --prototype 19.fpga-cpu-hdmi-ls --seeds 1 2 3 4 5 6 7 8
#
# Con las seis instrucciones de 8 y 16 bits dentro, la semilla 1 --la que traia
# la 18-- se queda en 80,63 MHz, un +0,8% que no es margen ninguno. Rebarrido:
# cumplen siete de ocho, entre 73,14 y 89,56 MHz. Se fija la 6, la de mas
# margen, con +11,9%.
#
# El diseno perdio unos 5 MHz de holgura respecto a la 18 (que da 7 de 8 entre
# 80,9 y 94,0). No es por las instrucciones nuevas: el camino critico sigue
# estando en el handshake de memoria --adaptador, arbitro y controlador--, el
# mismo sitio que en la 18. Lo que ha pasado es que el diseno crecio ~200 LUTs
# y ese camino, que ya era el que mandaba, se coloca peor.
#
# Con JAL, JALR y JR dentro, rebarrido: cumplian siete de ocho, entre 79,38 y
# 89,17 MHz. La semilla 6 --la que estaba fijada-- seguia cumpliendo con +8,4%,
# asi que las llamadas no movieron nada. Es lo esperable, porque reutilizan
# STATE_BRANCH_COMMIT entero y lo unico que anaden al camino de datos es un
# sumador de 32 bits que no esta en el camino critico, que sigue siendo el
# handshake de memoria.
#
# Y despues, subiendo la version del monitor de 1.12 a 1.13 --una constante de
# ocho bits, nada mas-- ese barrido dejo de valer: cumplen las ocho, pero entre
# 80,35 y 87,18, y la 8 se cayo de 89,17 a 83,61. No es que el diseno cambiara;
# es que cambio el netlist lo justo para que el placer tome otras decisiones.
#
# Esa es la leccion util de este fichero: la semilla NO es una propiedad del
# diseno, es una propiedad de un netlist concreto. Cualquier cambio de RTL, por
# tonto que parezca, invalida el barrido anterior. Que ahora cumplan las ocho
# --la primera vez en esta carpeta-- tampoco significa que el diseno haya
# mejorado; significa que este netlist se coloca mejor. Se fija la 3, la de mas
# margen.
# Con el decodificador MMIO y el puerto serie dentro: ocho de ocho, entre 82,88
# y 93,35 MHz. Se fija la 3, +16,7%, el mejor margen que ha tenido esta carpeta.
#
# Merece la pena contar el camino, porque es un aviso sobre como leer un
# barrido. Con el decodificador y el dispositivo pero SIN los comandos del
# monitor, el barrido dio TRES de ocho (77,39 a 87,88) y parecia una regresion
# de verdad. No lo era: al anadir los dos comandos --o sea MAS logica-- volvio
# a ocho de ocho y con mas margen que nunca.
#
# O sea que un barrido flojo no demuestra que el ultimo cambio cueste
# frecuencia. Aqui el camino critico nunca se movio de su sitio de siempre
# --scanout_i.req_line -> source_i.req_addr, sin un solo bloque de MMIO
# dentro-- y lo que variaba era como se colocaba ese camino. Antes de tocar
# RTL por un barrido malo, conviene mirar QUE camino es.

# BACKPORT DE R0 CABLEADO A CERO: barrido rehecho, y una confirmacion mas de lo
# que dice el parrafo de arriba. El cambio es UNA LINEA en register_file.v, y
# aun asi la semilla 3 --la que estaba fijada-- cayo de 87,18 a 83,72 MHz. La
# semilla nunca fue una propiedad del diseno.
#
# Rebarrido: cumplen siete de ocho, entre 80,74 y 89,19 MHz. Se fija la 6, la de
# mas margen, con +11,5%.
# FASE 3.5 (VIDEO_CTRL, contadores en MMIO, SYS_ID, bases de FB a cero): la
# semilla 6 se cayo de 88,00 a 72,06 MHz, un 9,9 % corta. El bisect senala al
# commit de VIDEO_CTRL: 82,52 -> 89,32 -> 86,93 -> 72,06.
#
# Rebarrido: cumplen TRES de ocho, entre 72,06 y 84,99. Se fija la 4, +6,2 %.
#
# Y aqui toca ser honesto con el numero, porque tres de ocho es peor que
# cualquier barrido anterior de esta carpeta --daban siete u ocho, entre 80 y
# 94-- y la mediana, 79,9, cae POR DEBAJO de la restriccion. Este netlist esta
# al borde de verdad, no solo mal colocado.
#
# Aun asi no se toca RTL, por dos razones que hay que releer juntas. Una: mas
# arriba en este mismo fichero esta registrado otro 3-de-8 que parecia una
# regresion real y no lo era --al anadir MAS logica volvio a 8 de 8--. Dos: el
# camino critico sigue siendo el de siempre aqui, el handshake de memoria
# (`source_i.urgent_r` en video_line_source_burst.v -> controlador -> fabric),
# sin un solo bloque de MMIO dentro, y son 2,18 ns de logica contra 11,70 ns de
# enrutado. No hay logica nueva en el camino; hay 84 % de cable.
#
# Lo que SI deja esto pendiente es mirar por que `urgent_r` se dispersa tanto
# --saltos de (96,44) a (109,35)--. Eso es trabajo aparte, no de esta ronda.

# MIGRACION A MMIO v2: barrido rehecho, y sale MEJOR que el anterior.
#
# Antes de barrer hubo que SINTETIZAR: `build-sweep` re-ruta el hardware.json del
# build archivado mas reciente, y el de esta carpeta era del 17/09, de antes de
# migrar. Ver la nota equivalente en el apio.ini de la 18.
#
# Con el RTL en v2: cumplen SEIS de ocho, entre 77,58 y 85,02 MHz, mediana 81,81.
#
#   semilla 5  85,02 MHz  +6,3%       semilla 4  81,51   +1,9%
#   semilla 8  84,55      +5,7%       semilla 1  78,32   FALLA
#   semilla 3  83,72      +4,7%       semilla 6  77,58   FALLA
#   semilla 7  81,52      +1,9%
#   semilla 2  82,10      +2,6%
#
# Se fija la 5, la de mas margen. La 4 --la que estaba fijada-- sigue cumpliendo,
# con +1,9%, que es poco margen pero no es un fallo.
#
# Lo importante es la comparacion con el barrido anterior, que esta justo arriba
# y era el peor que ha tenido esta carpeta:
#
#                     v1 (fase 3.5)      v2 (hoy)
#   cumplen de 8            3                6
#   mediana              79,9 MHz         81,81 MHz
#   peor                 72,06            77,58
#   mejor                84,99 (s4)       85,02 (s5)
#
# O sea que v2 no solo no cuesta frecuencia aqui: **arregla** el 3-de-8 que el
# apio.ini de arriba declaraba «al borde de verdad, no solo mal colocado». La
# mediana vuelve a estar POR ENCIMA de la restriccion, que era justo lo que
# aquella nota daba por perdido. El diseno crecio ~650 LUTs y aun asi mejoro,
# asi que aquel 3-de-8 era colocacion, como sospechaba la primera de las dos
# razones que alli se dieron para no tocar RTL.
#
# Queda, eso si, lo que aquella nota dejaba pendiente y sigue pendiente: mirar
# por que `source_i.urgent_r` se dispersa tanto. Esto no lo resuelve.

# Y rebarrido otra vez tras arreglar la vida del error de dato en
# video_registers.v --una linea, ver docs/validacion-mmio-v2-placa.md--.
#
# Cumplen LAS OCHO, entre 80,14 y 88,87 MHz, mediana 85,31.
#
#   semilla 4  88,87 MHz  +11,1%      semilla 3  83,48   +4,3%
#   semilla 5  87,99      +10,0%      semilla 2  83,10   +3,9%
#   semilla 8  87,30       +9,1%      semilla 6  82,94   +3,7%
#   semilla 1  87,13       +8,9%      semilla 7  80,14   +0,2%
#
# Se fija la 4, +11,1%.
#
# Con esto la carpeta cierra el ciclo que empezo con aquel 3-de-8 de la fase
# 3.5, cuando este mismo fichero declaraba el netlist «al borde de verdad, no
# solo mal colocado». Fue MMIO v2 quien lo devolvio a 6-de-8, y este arreglo de
# una linea lo lleva a 8-de-8 con la mejor mediana que ha tenido la carpeta
# (85,31). Era colocacion, las dos veces.
nextpnr-extra-options = --seed 4