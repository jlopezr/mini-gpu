[apio]
default-env = colour-cycle

[common]
board = ulx3s-85f

# The 370 MHz TMDS serial clock is tight on this -6 part, so the nextpnr seed
# is pinned. Re-check after ANY RTL change:
#   (Get-Content _build/<env>/hardware.pnr -Raw | ConvertFrom-Json).fmax
# and confirm $glbnet$clk_pix_5x achieved >= constraint.
nextpnr-extra-options = --seed 5

[env:colour-cycle]
top-module = top_colour_cycle

[env:bounce]
top-module = top_bounce

[env:hello]
top-module = top_hello
nextpnr-extra-options = --seed 1
