[apio]
default-env = colour-cycle

[common]
board = ulx3s-85f

# The 370 MHz TMDS serial clock is tight on this -6 part, so the nextpnr seed
# is pinned. Re-check after ANY RTL change:
#   (Get-Content _build/<env>/hardware.pnr -Raw | ConvertFrom-Json).fmax
# and confirm $glbnet$clk_pix_5x achieved >= constraint.
#
# `--detailed-timing-report` va en los TRES envs, no solo aqui: una opcion de
# env SUSTITUYE a la de [common], no se suma. Sin ella `build` acaba en
# "Missing timing report" aunque la sintesis haya ido bien, y el prototipo se
# queda fuera de las tablas generadas -- justo el que mas necesita vigilar el
# timing.
nextpnr-extra-options = --seed 5 --detailed-timing-report

[env:colour-cycle]
top-module = top_colour_cycle

[env:bounce]
top-module = top_bounce
nextpnr-extra-options = --seed 12 --detailed-timing-report

[env:hello]
top-module = top_hello
nextpnr-extra-options = --seed 1 --detailed-timing-report
