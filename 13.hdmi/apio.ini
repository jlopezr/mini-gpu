[apio]
default-env = colour-cycle

[common]
board = ulx3s-85f

# NOTE: the 370 MHz TMDS serial clock only just closes timing on this -6 part,
# so the nextpnr seed is pinned per env and must be re-checked after ANY RTL
# change. Verify with:  _build/<env>/hardware.pnr -> fmax.$glbnet$clk_pix_5x

[env:colour-cycle]
top-module = top_colour_cycle
nextpnr-extra-options = --seed 12

[env:bounce]
top-module = top_bounce
nextpnr-extra-options = --seed 11
