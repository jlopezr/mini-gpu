[env:default]
board = ulx3s-85f
top-module = top
# Sin esto el `build.log` trae el resumen de temporizacion pero no el desglose
# del camino critico, y el camino critico es justo lo que hay que mirar al
# migrar a MMIO v2: la 16 perdio frecuencia por un lazo que empieza en un bit
# que solo existe porque v2 ensancha la direccion. La 17 y la 22 ya lo tenian;
# esta y la 14 no, y el desglose no se puede sacar de un log viejo.
nextpnr-extra-options = --detailed-timing-report
default-testbench = gpu_system_tb.v
# The installed Yosys 0.63 AUTONAME pass grows without practical bounds on this
# netlist (both ABC flows). Keep mapping and all checks, omit only name expansion.
# Explicit JSON path corresponds to this project's single 'default' environment.
yosys-extra-options = -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/default/hardware.json
