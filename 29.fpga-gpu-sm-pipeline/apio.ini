[apio]
default-env = default

# Aqui SI se fija semilla (--seed 2 en nextpnr-extra-options, abajo), a
# diferencia del criterio de 12, 14, 17 y 22 (sin semilla, porque en la
# familia GPU el margen se mide en decenas de por ciento). Esta carpeta es la
# excepcion: el cauce segmentado de gpu_sm.v sube el LUT4 un 23% sobre la 22
# (43065 vs 34939), y sin semilla el router de nextpnr cayo en un minimo local
# de congestion del que no salio en 100+ minutos (ver profiling.md/README).
# La semilla 2 si converge, en ~32 min, con Fmax 75,47 MHz en clk_pix (25 MHz
# objetivo, PASS con margen amplio). Para rehacer el barrido tras un cambio de
# RTL:
#   ..\tools\build-sweep.ps1 --prototype 29.fpga-gpu-sm-pipeline --seeds 1 2 3 4 5 6 7 8
# Ejecuta `..\tools\build.ps1 --prototype 29` ANTES: build-sweep no sintetiza,
# re-ruta el hardware.json archivado, y si el RTL ha cambiado desde entonces
# devuelve ocho numeros plausibles y falsos.
#
# Esta carpeta parte de 22.fpga-gpu-bl8 (gpu_lsu2 + memory_fabric_4 +
# sdram_controller_128 sin tocar) y solo reescribe gpu_sm.v: la linea base
# LSU v1/BL1 que 22 conservaba para comparar ya vive alli, no se duplica
# aqui. La comparacion de esta carpeta es de CICLOS/CPI contra la 22
# (docs/migracion-v2.md y profiling.md), no de Fmax entre dos sistemas
# propios.

[common]
board = ulx3s-85f
# --seed 2 fijada: ver la nota de [apio] arriba. No quitar sin comprobar
# antes que el router converge sin ella (o volver a barrer semillas).
nextpnr-extra-options = --detailed-timing-report --seed 2
default-testbench = gpu_lsu2_tb.v
# Misma razon que en 17/22: el pase AUTONAME de Yosys 0.63 crece sin limite
# practico en este netlist. Se conserva el mapeo y todas las comprobaciones,
# se omite solo la expansion de nombres.

[env:default]
top-module = top_bl8
yosys-extra-options = -run begin:check; hierarchy -check; stat; check -noinit; blackbox =A:whitebox; write_json _build/default/hardware.json
