[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# BACKPORT DE R0 CABLEADO A CERO: este core necesita semilla fija desde el
# backport, y antes no.
#
# Con la semilla por defecto de nextpnr el diseno se quedaba en 117,30 MHz, un
# -2,3% sobre los 120 del .lpf: NO cumplia. El cambio es una sola linea en
# register_file.v --descartar la escritura a R0--, y encima quita logica: 4962
# LUTs frente a 4976. No es que el diseno empeorara; es que el netlist cambio lo
# justo para que el placer tomara otras decisiones, que es la misma leccion que
# tiene escrita la 19 en su apio.ini y aqui se cobra por primera vez.
#
# Rebarrido: cumplen seis de ocho, entre 112,64 y 126,18 MHz. Se fija la 6, la
# de mas margen, con +5,1%.
#
# Para repetirlo:
#   ..\tools\seed-sweep.ps1 -ProjectDir 10.fpga-cpu-ram -Seeds @(1,2,3,4,5,6,7,8)
nextpnr-extra-options = --seed 6
