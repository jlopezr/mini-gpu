[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# BACKPORT DE R0 CABLEADO A CERO: este core necesita semilla fija desde el
# backport, y antes no.
#
# Con la semilla por defecto de nextpnr el diseno se quedaba en 117,30 MHz, un
# -2,3% sobre los 120 del .lpf: NO cumplia. El cambio es una sola linea en
# register_file.v --descartar la escritura a R0--, y encima quita logica: 4962
# LUTs frente a 4976. No es que el diseno empeorara; es que el netlist cambio lo
# justo para que el placer tomara otras decisiones, que es la misma leccion que
# tiene escrita la 19 en su apio.ini y aqui se cobra por primera vez.
#
# Rebarrido: cumplen seis de ocho, entre 112,64 y 126,18 MHz. Se fija la 6, la
# de mas margen, con +5,1%.
#
# Para repetirlo:
#   ..\tools\build-sweep.ps1 --prototype 10.fpga-cpu-ram --seeds 1 2 3 4 5 6 7 8
#
# Rebarrido otra vez al quitar los tres `localparam` de MUL/MULFX/DIV, que no
# cambian el comportamiento --esos opcodes ya caian al default-- y aun asi
# dejaron la semilla 6 en 121,70 MHz, un +1,4% que no es margen. Ahora cumplen
# las ocho, entre 121,70 y 129,58; se fija la 1, la de mas margen, con +8,0%.
#
# Van ya tres barridos en esta carpeta por cambios que "no cambian nada": el
# guardian de R0, el port de MUL/DIV que se descarto, y esto. Es la carpeta que
# mejor demuestra la advertencia de arriba.
#
# WRITE_WORD Y RELOJ A 100 MHz. A 120 no cumplia ninguna semilla ni antes ni
# despues de sacar la BRAM del mux de `response_byte_0` en monitor.v: 95,07 a
# 103,56 (mediana 99,41) con el mux, 104,40 a 113,01 (mediana 106,49) sin el.
# El cambio de monitor.v vale un +7 % y aun asi 120 quedaba lejos, asi que se
# baja la restriccion --ver pll_100.v-- y con ella el baudio, de 3 a 1 Mbaud.
#
# A 100 cumplen SIETE de ocho, entre 99,96 y 115,55, mediana 107,36. Se fija la
# 2, la de mas margen, +15,6 %. Aqui la semilla ya no decide si el diseno
# funciona, solo cuanto margen sobra, que es donde conviene estar.
#
# MIGRACION A MMIO v2 (20/09/2026). El bloque de identificacion pasa de cuatro
# palabras en 0x80000F00 a siete en 0x80000000, y con el la seleccion de
# `sysid_selected` y la ventana del monitor. No se anade ningun dispositivo:
# esta carpeta sigue sin MMIO de verdad.
#
# Rebarrido obligatorio, como siempre que se toca RTL. Cumplen LAS OCHO, entre
# 106,44 y 115,17, mediana 111,37. Se fija la 6, la de mas margen, +15,2 %.
#
# Contra el barrido anterior del MISMO juego de ocho semillas --que es la
# unica comparacion que significa algo-- la migracion pasa de 7 de 8 a 8 de 8
# y sube el suelo de 99,96 a 106,44. El techo baja de 115,55 a 115,17, o sea
# nada. La 2, que era la fijada, sigue cumpliendo con 106,44: no habria hecho
# falta cambiarla, pero la 6 da nueve MHz mas por el mismo precio.
#
# Para repetirlo:
#   ..\tools\build-sweep.ps1 --prototype 10.fpga-cpu-ram --seeds 1 2 3 4 5 6 7 8
nextpnr-extra-options = --seed 6