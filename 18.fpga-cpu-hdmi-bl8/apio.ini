[env:default]
board = ulx3s-85f
top-module = top
default-testbench = cpu_sdram_system_tb.v

# El dominio de CPU corre a 80 MHz desde que el camino de memoria pasa a 128
# bits: a 100 no cumple NINGUNA semilla (83,9 a 91,8 MHz, mediana 86,4). A 80
# cumplen las ocho; con la combinacion de escrituras dentro, entre 83,14 y
# 93,24 MHz, asi que la semilla vuelve a no
# decidir si el diseno funciona. Se fija la mejor por margen.
#
# Con los contadores de rendimiento dentro, la semilla 2 --que era la fijada--
# se cayo a 79,15 MHz, un 1,1% corta. Rebarrido: cumplian siete de ocho, entre
# 80,93 y 93,95 MHz. El diseno no estaba al limite; lo estaba la semilla.
#
# Desde que DQ se captura en el flanco de bajada, el barrido vuelve a salir
# holgado: ocho de ocho, entre 85,7 y 94,8 MHz. Se fija la 1, la de mas margen.
#
# CUIDADO con lo que este numero significa. Mide caminos DENTRO del chip. El
# fallo que tuvo esta carpeta en placa estaba en la captura de DQ, que entra
# por un pin, y con el diseno roto este barrido daba +14,5% de holgura igual.
# Una semilla que cumple no dice que la SDRAM se lea bien: eso lo dice la
# matriz de beats x DQ del README.
#
# Lo que sigue es la historia anterior, de cuando la restriccion era 100:
# A 120 no cumplia ninguna
# semilla, ni siquiera despues de sacar la decodificacion de opcode del cono de
# datos del PC. Tras anadir MUL, MULFX y DIV cumplen siete de ocho, entre 95,37
# y 112,88 MHz. Se fija la mejor por margen: aqui la semilla casi nunca decide
# si el diseno funciona. El razonamiento completo esta en README.md.
#
# Conviene rebarrer semillas tras un cambio de RTL grande:
#   ..\tools\build-sweep.ps1 --prototype 18.fpga-cpu-hdmi-bl8 --seeds 1 2 3 4 5 6 7 8
#
# Rebarrido tras arreglar la doble concesion de `mmio_mux`: cumplen las ocho,
# entre 86,63 y 95,27 MHz. Se fija la 3, +19,1%. La semilla 1 --la que estaba
# fijada-- sigue cumpliendo con +9,2%, asi que el arreglo no costo frecuencia;
# lo que cambio es la colocacion, como siempre que se toca el RTL.

# BACKPORT DE R0 CABLEADO A CERO: barrido rehecho.
#
# El cambio es una linea en register_file.v --descartar la escritura a R0-- y
# aun asi invalida el barrido anterior, como cualquier otro cambio de RTL: la
# semilla es propiedad de un netlist, no de un diseno. Con la semilla vieja
# este core daba 83,46 MHz (+4,3%); rebarrido, cumplen las ocho, entre 81,34 y 94,53 MHz; se fija la 4, +18,2%.

# MIGRACION A MMIO v2: barrido rehecho.
#
# Antes de barrer hubo que SINTETIZAR, porque `build-sweep` no sintetiza: re-ruta
# el hardware.json del build archivado mas reciente, y el de esta carpeta era del
# 17/09, o sea de antes de migrar. Barrerlo tal cual habria dado ocho numeros
# buenos de un diseno que ya no existe, sin nada en la salida que lo delatara.
#
# Con el RTL en v2: cumplen LAS OCHO, entre 82,11 y 88,76 MHz, mediana 84,83.
#
#   semilla 6  88,76 MHz  +11,0%      semilla 3  85,00   +6,3%
#   semilla 1  87,29      +9,1%       semilla 5  84,67   +5,8%
#   semilla 4  85,21      +6,5%       semilla 2  84,40   +5,5%
#                                      semilla 7  83,86   +4,8%
#                                      semilla 8  82,11   +2,6%
#
# Se fija la 6, la de mas margen. La 4 --la que estaba fijada-- seguia cumpliendo
# con +6,5%, asi que la migracion no invalido la semilla en la practica; se
# cambia porque hay bastante mas margen disponible.
#
# Comparado con el barrido anterior (v1: ocho de ocho, 81,34 a 94,53): mismo
# 8-de-8 y el suelo sube un poco (81,34 -> 82,11); lo que baja es el techo, unos
# 6 MHz, por los ~630 LUTs que anade el mapa nuevo. v2 NO cuesta robustez aqui.
#
# Esta es, de las tres carpetas ya en v2, la que mas margen tiene.
#
# Y sigue en pie el aviso de mas arriba: una semilla que cumple no dice que la
# SDRAM se lea bien. Eso lo dice la matriz de beats x DQ.

# Y rebarrido otra vez tras arreglar la vida del error de dato en
# video_registers.v --una linea, ver docs/validacion-mmio-v2-placa.md--, porque
# cualquier cambio de RTL invalida el barrido anterior.
#
# Cumplen LAS OCHO otra vez, entre 82,52 y 87,67 MHz, mediana 84,03.
#
#   semilla 2  87,67 MHz  +9,6%       semilla 6  84,49   +5,6%
#   semilla 5  86,13      +7,7%       semilla 8  83,57   +4,5%
#   semilla 1  85,38      +6,7%       semilla 4  83,07   +3,8%
#                                      semilla 3  82,52   +3,2%
#                                      semilla 7  82,52   +3,2%
#
# Se fija la 2, +9,6%. La 6 --la que estaba fijada-- sigue cumpliendo con
# +5,6%, o sea que el arreglo no costo frecuencia; se cambia por margen.
#
# El techo baja un poco respecto al barrido anterior (88,76 -> 87,67) y el
# suelo sube (82,11 -> 82,52): es el mismo 8-de-8 recolocado, no una tendencia.
nextpnr-extra-options = --seed 2